<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2e9" />
    <meta name="description" content="Watch the two-minute AgriTec product tour." />
    <title>AgriTec demo — Farm smarter. Grow stronger.</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #203b2f;
        background: #f4f2e9;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 12% 10%, rgb(186 207 149 / 26%), transparent 38%),
          radial-gradient(ellipse at 92% 90%, rgb(208 185 127 / 18%), transparent 35%),
          #f4f2e9;
      }

      main { width: min(100%, 1024px); }

      .eyebrow {
        margin: 0 0 12px;
        color: #67834c;
        font-size: 0.76rem;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.35rem, 6vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 1.03;
      }

      .intro {
        margin: 14px 0 28px;
        color: #627066;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
      }

      .player {
        overflow: hidden;
        padding: 10px;
        border: 1px solid rgb(32 59 47 / 9%);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 28px 80px rgb(38 49 39 / 14%);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        background: #1d2b23;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        color: #69766d;
        font-size: 0.88rem;
      }

      a { color: #416738; font-weight: 700; text-underline-offset: 3px; }

      @media (max-width: 520px) {
        body { padding-inline: 14px; }
        .player { padding: 6px; border-radius: 16px; }
        video { border-radius: 11px; }
        .footer { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A two-minute product tour</p>
      <h1>Farm smarter.<br />Grow stronger.</h1>
      <p class="intro">Take a quick look around AgriTec, a friendly digital workspace for the people who grow our food.</p>
      <div class="player">
        <video controls playsinline preload="metadata" poster="./AgriTec-demo-poster.png">
          <source src="./AgriTec-demo.mp4" type="video/mp4" />
          Your browser does not support MP4 playback. <a href="./AgriTec-demo.mp4">Download the video</a> instead.
        </video>
      </div>
      <div class="footer">
        <span>720p · H.264 · captions included</span>
        <a href="./AgriTec-demo.mp4" download>Download the MP4</a>
      </div>
    </main>
  </body>
</html>
